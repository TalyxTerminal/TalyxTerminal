[project]
name = "talyx"
version = "0.2.0"
description = "TALYX — local-first modular workspace (new-era repository)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "exchange-calendars>=4.5",
    "ccxt>=4.5.93",
    "aiohttp>=3.14.5",
    "anyio>=4.4",
    "duckdb>=1.0",
    "websockets>=17.1",
    "mcp>=1.26,<2",
    "jsonschema>=4.23",
    "pyarrow>=17",
    "semantic-version>=2.10,<3",
    "pynesys-pynecore==6.10.7",
    "yfinance>=0.2.65,<1",
    "akshare>=1.17,<2",
    "baostock>=0.8.9,<1",
    "databento>=0.60,<1",
    "ib-async>=2,<3",
    "debugpy==1.8.22",
    "pywebview==6.2.1; sys_platform == 'win32'",
    "pystray==0.19.5; sys_platform == 'win32'",
    "Pillow==13.0.0; sys_platform == 'win32'",
    "deepagents==0.7.39",
    "langchain==1.5.0",
    "langchain-core==1.8.3",
    "langgraph==1.2.22",
    "langchain-openai==1.7.2",
    "langchain-anthropic==1.7.11",
    "langchain-google-genai==4.5.0",
    "langchain-ollama==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pypdf>=6,<8",
    "trafilatura>=2,<3",
    "httpx2>=2.16,<3",
    "httpx>=0.28,<1",
    "windows-toasts==1.3.1 ; sys_platform == 'win32'",
    "mlflow-skinny==3.12.0",
    "pyzmq>=27,<28",
    "jupyter-client>=8.8,<9",
    "basedpyright>=1.40,<2",
]

[project.entry-points."pyne.plugin"]
# request.security bars of another symbol or timeframe, handed over by Chart's Pine worker
talyx = "modules.chart.backend.pine.feed:TalyxFeed"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.15,<1",
    "httpx>=0.27",
    "datamodel-code-generator>=0.83,<1",
    "pyright>=1.1.411,<2",
    "pytest-timeout>=2.3,<3",
]

[tool.uv]
environments = ["sys_platform == 'win32' and python_version == '3.13'"]
# The generator uses the existing Ruff formatter. Its unused Black/isort
# defaults would pull pathspec (MPL-2.0), outside the approved license set.
# databento's pip-system-certs makes every Python process verify each new TLS connection with Windows' certificate
# chain check (revocation included) inside the handshake, on the event loop: 100-300 ms per host. Python's own TLS
# already trusts the Windows root store.
exclude-dependencies = ["black", "isort", "pip-system-certs"]

[tool.uv.sources]
pynesys-pynecore = { path = "modules/chart/backend/engine_materials/pynesys_pynecore-6.10.7-7talyx-cp313-cp313-win_amd64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host", "sdk/talyx_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:langsmith_plugin"
# A hung test stops itself and prints every thread's stack instead of waiting for whoever started the run.
timeout = 300
markers = [
    "market_egress: the test drives Market's real network egress (through a local proxy)",
    "timing: the test asserts wall-clock time, so it runs alone, outside the parallel run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F and B catch real mistakes; I and UP are auto-fixable. E (line length, statement layout) is style only and not enforced.
select = ["F", "I", "UP", "B"]
# B905/B008 are pedantic for this codebase. B023 has 25 legacy hits to clear; re-enable after.
ignore = ["B905", "B008", "B023"]

[tool.ruff.lint.per-file-ignores]
# Copied byte for byte into the PyneCore wheel; any edit changes the approved wheel identity.
"scripts/chart_engine/runner_context.py" = ["I001"]
